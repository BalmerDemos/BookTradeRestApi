# =========================
# ?? MongoDB Configuration
# =========================

# Connection URI to local MongoDB instance on default port (27017)
# "book_trade" is the name of the database
spring.data.mongodb.uri=mongodb://localhost:27017/book_trade


# ============================
# ? Swagger / OpenAPI Config
# ============================

# Location where the OpenAPI spec JSON will be available
springdoc.api-docs.path=/v3/api-docs

# Path to access Swagger UI for testing and exploring the API
# Open http://localhost:9081/swagger-ui.html in your browser
springdoc.swagger-ui.path=/swagger-ui.html


# ===================
# ? Server Settings
# ===================

# Port on which your REST API will run (default is 8080)
server.port=9081


# =========================
# ? Error Handling Config
# =========================

# Throw an exception if no controller handles the request (useful for global error handling)
spring.mvc.throw-exception-if-no-handler-found=true

# Disable Spring Boot's default static resource mappings (e.g., index.html, /static/**)
# Useful when building an API-only backend
spring.web.resources.add-mappings=false


# =====================
# ? Logging Config
# =====================

# Log levels for various parts of the Spring Web stack
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.http=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# Show detailed logs for Spring Security (can help debug authentication/authorization)
logging.level.org.springframework.security=DEBUG

# Enable colored log output for better visibility in console (works in most modern terminals)
spring.output.ansi.enabled=ALWAYS


# =========================
# ? Swagger UI Access Hint
# =========================

# Just a note/reminder for developers:
# Visit Swagger UI at: http://localhost:9081/swagger-ui.html
